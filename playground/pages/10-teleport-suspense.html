<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>10. Teleport + Suspense</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 920px;
    margin: 32px auto;
    padding: 0 16px;
    color: #1f2937;
    background: #f8fafc;
  }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; margin-top: 40px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
  p.note { color: #64748b; font-size: 14px; line-height: 1.6; }
  .panel {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
  }
  button {
    cursor: pointer;
    border: 1px solid #cbd5e1;
    background: #fff;
    border-radius: 6px;
    padding: 6px 12px;
    margin-right: 8px;
    font-size: 13px;
  }
  button:hover { background: #f1f5f9; }

  /* ---- Teleport modal：挂到 <body> 上，所以用 position: fixed 遮罩全屏 ---- */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-box {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 320px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  }
  .modal-box h3 { margin-top: 0; }

  /* ---- Suspense 异步卡片 ---- */
  .card {
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    padding: 14px;
    margin-top: 10px;
  }
  .skeleton {
    color: #94a3b8;
    font-style: italic;
  }
</style>
</head>
<body>
<div id="app"></div>

<!--
  运行：pnpm play，然后浏览器打开 /pages/10-teleport-suspense.html
  演示：① <Teleport to="body"> 把弹窗渲染到 <body> 末尾，而不是当前组件的 DOM 位置里
       ② <Suspense> 包裹一个 async setup() 组件，加载过程中显示 fallback 骨架屏
  看点：① 用浏览器 devtools 打开 Elements 面板，点「打开弹窗」后能看到 <body> 最下面多出
          modal 的 DOM，而触发按钮所在的组件树位置只剩两个注释节点（teleport start/end）
       ② 点「重新加载」会让 Suspense 再走一遍 fallback → resolve 的流程，可以观察到
          骨架屏出现、等待、消失的完整过程（和 chapters/10-builtin-components 的示例 03 是同一套机制，
          只是这里换成了真实浏览器 + setTimeout 模拟网络延迟）
-->

<script type="module">
  import { createApp, h, ref, defineComponent, Teleport, Suspense } from 'vue'

  // ====================================================================
  // 1. Teleport：弹窗挂到 document.body
  // ====================================================================
  const Modal = defineComponent({
    name: 'Modal',
    emits: ['close'],
    setup(_, { emit }) {
      return () =>
        h(Teleport, { to: 'body' }, [
          h('div', { class: 'modal-mask', onClick: () => emit('close') }, [
            h(
              'div',
              {
                class: 'modal-box',
                // 阻止冒泡，避免点击弹窗内部也关闭弹窗
                onClick: e => e.stopPropagation(),
              },
              [
                h('h3', null, '我是被 Teleport 到 <body> 的弹窗'),
                h(
                  'p',
                  null,
                  '打开 devtools 的 Elements 面板能看到：这个 .modal-mask 节点实际上是 ' +
                    '<body> 的最后一个子元素，而不是嵌在触发按钮旁边。',
                ),
                h('button', { onClick: () => emit('close') }, '关闭'),
              ],
            ),
          ]),
        ])
    },
  })

  const TeleportDemo = defineComponent({
    name: 'TeleportDemo',
    setup() {
      const open = ref(false)
      return () =>
        h('div', { class: 'panel' }, [
          h('button', { onClick: () => (open.value = true) }, '打开弹窗（Teleport 到 body）'),
          open.value ? h(Modal, { onClose: () => (open.value = false) }) : null,
        ])
    },
  })

  // ====================================================================
  // 2. Suspense：async setup() 组件 + fallback 骨架屏
  // ====================================================================
  function makeAsyncCard(seed) {
    return defineComponent({
      name: 'AsyncCard',
      async setup() {
        const delay = 600 + Math.floor(Math.random() * 800)
        await new Promise(resolve => setTimeout(resolve, delay))
        return () =>
          h('div', { class: 'card' }, [
            h('strong', null, `卡片 #${seed}`),
            h('p', null, `模拟网络请求耗时 ${delay}ms 后渲染出的真实内容。`),
          ])
      },
    })
  }

  const SuspenseDemo = defineComponent({
    name: 'SuspenseDemo',
    setup() {
      const reloadKey = ref(0)
      // key 变了之后，Suspense 的 default 分支会拿到一组全新的子组件，
      // 重新触发一轮 async setup -> fallback -> resolve
      const AsyncCardA = makeAsyncCard.bind(null)

      return () =>
        h('div', { class: 'panel' }, [
          h('button', { onClick: () => (reloadKey.value++) }, '重新加载（重新触发 fallback）'),
          h(
            Suspense,
            {
              key: reloadKey.value,
              onPending: () => console.log('[Suspense] onPending'),
              onFallback: () => console.log('[Suspense] onFallback'),
              onResolve: () => console.log('[Suspense] onResolve'),
            },
            {
              default: () =>
                h('div', null, [h(makeAsyncCard(1)), h(makeAsyncCard(2))]),
              fallback: () =>
                h('div', { class: 'card skeleton' }, '正在加载异步卡片...（打开控制台看 onPending/onFallback/onResolve 事件）'),
            },
          ),
        ])
    },
  })

  const App = defineComponent({
    name: 'App',
    render() {
      return h('div', null, [
        h('h1', null, '10. Teleport + Suspense'),
        h(
          'p',
          { class: 'note' },
          '对应 chapters/10-builtin-components 的 Teleport / Suspense 小节；章节示例用的是 ' +
            'shared/logging-renderer（假 DOM），这里换成真实浏览器，便于用 devtools 直接验证 DOM 结构。',
        ),
        h('h2', null, '1. Teleport：弹窗渲染到 <body>'),
        h(TeleportDemo),
        h('h2', null, '2. Suspense：async setup() + fallback 骨架屏'),
        h(SuspenseDemo),
      ])
    },
  })

  createApp(App).mount('#app')
</script>
</body>
</html>
